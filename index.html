<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Untitled</title>
</head>

<body>
    <div id="output"> </div>
        <p id="para">
            some text here
        </p>

        <button>
            Red
        </button>

        <button>
            Blue
        </button>
    <p id="time">
      
  </p>

  <p id="while">
    
  </p>
    <script>
      let hour;
      const time = 9;//newDate().getHours();
      let greeting;
      
        function changeColor(newColor) {
            const elem = document.getElementById("para")
            elem.style.color = newColor;
        }

        document.querySelectorAll("button").forEach((button) => {
            button.addEventListener("click", (event) => {
                changeColor(event.target.textContent.toLowerCase());
            });
        });

        function add(a, b) {
            return a + b;
        }

        let result = add(13, 35);

        function log(message) {
            console.log(message);

            document.getElementById("output").innerHTML +=
                "<p>" + message + "</p>";

            document.getElementById("output").innerHTML +=
                "<p>" + result + "</p>";
        }

        log("Hello World");
      
      if (hour < 18) {
        greeting = "good day";
      }
      else {
        greeting = "good evening!";
      }
      
      let wake = false;
      
      if (time <= 9 || wake !== true) {
        greeting = "morning";
      }
      else if (time < 14) {
        greeting = "good afternoon";
      }
      else {
        greeting = "good day";
      }
      
      // Inner HTML 
      document.getElementById("time").innerHTML = greeting;
      
      let text = "";
      let i =0;
      while (i < 10) {
        text += "The number is " + i + "<br>";
        i++;
      }
      
      document.getElementById("while").innerHTML = text;
    </script>
</body>
</html>
